#VRML_SIM R2025a utf8

PROTO seven [
  field SFVec3f    translation  0 0 0
  field SFRotation rotation     0 0 1 0
  field SFString   name         "seven"
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      Transform {
        translation 0.5 2.0 0.2
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.5 0.5 0.5
              roughness 1.0
              metalness 0
            }
            geometry Box {
              size 1.3 0.3 0.4
            }
          }
        ]
      }
      Transform {
        translation 1.0 1.0 0.2
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.5 0.5 0.5
              roughness 1.0
              metalness 0
            }
            geometry Box {
              size 0.3 2.3 0.4
            }
          }
        ]
      }
    ]
    boundingObject Group {
      children [
        Transform {
          translation 0.5 2.0 0.2
          children [
            Box {
              size 1.3 0.3 0.4
            }
          ]
        }
        Transform {
          translation 1.0 1.0 0.2
          children [
            Box {
              size 0.3 2.3 0.4
            }
          ]
        }
      ]
    }

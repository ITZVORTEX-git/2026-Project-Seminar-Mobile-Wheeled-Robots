#VRML_SIM R2025a utf8

PROTO one [
    field SFVec3f translation 0 0 0 
    field SFRotation 0 0 1 0
    field SFString name "one"
]

{
    Solid {
        translation IS translation
        rotation IS rotation
        name IS name
    }
    children [
        Transfrom {
            translation 1.0 1.0 0.2
            children [
                Shape {
                    appearance PBRAppearance {
                        baseColor 0.5 0.5 0.5 
                        roughness 1.0
                        metalness 0
                    }
                    geometry Box {
                        size 0.3 2.3 0.4
                    }
                }
            ]
        }
    ]
    boundingObject Transfrom {
        translation 1.0 1.0 0.2
        children [
            Box {
                size 0.2 2.3 0.4
            }
        ]
    }
}